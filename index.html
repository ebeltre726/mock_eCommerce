<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock eCommerce</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Federant&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- HTML Structure -->
    <main class="hero">
    <nav class="navbar">
  
    <!-- Hamburger button (hidden on desktop) -->
    <button class="nav-toggle">
    <img src="hamburger.png" alt="Menu" class="hamburger"></span>
    </button>
  
    <!-- Menu (collapses on mobile) -->
        <ul class="nav-menu" id="navMenu">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
            <li><a href="#signup">Sign Up</a></li>
        </ul>
    </nav>
    <div class="ctaContainer">
        <span class="logo">Furniteria</h1></span>
        <p>Your domain for high-quality home appliances.</p>
        <div class="ctaButtons">
        <button class="ctaButton" id="products">View Our Products</button>
        <button class="ctaButton" id="contact">Contact Us</button>
    </div>
    </div>
    <button class="signupButton"><a href="signup">Sign Up!</a></button>
</main>
<script src="script.js"></script>
</body>
</html>
