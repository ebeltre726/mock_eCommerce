<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock eCommerce</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Federant&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- HTML Structure -->
    <main class="hero">
    <nav class="navbar">
    <button class="hamburger-btn" alt="MenuButton" onclick="toggleMenu()">
    <img src="hamburger.png" alt="Menu" id="hamburger-icon">
    </button>
    <!-- Menu (collapses on mobile) -->
        <ul class="nav-menu">
            <li><a href="#products">Products</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
            <li><a href="#signup">Sign Up</a></li>
        </ul>
    </nav>
    <div class="ctaContainer">
        <h1><span class="logo">Furnituria</h1></span>
        <p>Your domain for high-quality home appliances.</p>
        <div class="ctaButtons">
        <button class="ctaButton"><a href="#products">View Our Products</a></button>
        <button class="ctaButton"><a href="#signup">Sign Up!</a></button>
        </div>
    </div>
        
    </div>

    <!-- Overlays -->
    <section id="products-overlay" class="overlay">
        <div class="overlay-content">
            <h1>HorsDung.</h1>
            <p>Ay Ay Ay Oy Ay</p>
        </div>
    </section>

    <section id="about-overlay" class="overlay">
        <div class="overlay-content">
            <h1>HorsDung.</h1>
            <p>Ay Ay Ay Oy Ay</p>
        </div>
    </section>

    <section id="contact-overlay" class="overlay">
        <div class="overlay-content">
            <h1>HorsDung.</h1>
            <p>Ay Ay Ay Oy Ay</p>
        </div>
    </section>

    <section id="signup-overlay" class="overlay">
        <div class="overlay-content">
            <h1>HorsDung.</h1>
            <p>Ay Ay Ay Oy Ay</p>
        </div>
    </section>

</main>
<script src="script.js"></script>
</body>
</html>
