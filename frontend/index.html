<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock eCommerce</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Federant&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:wght@100;300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <footer class="site-footer">
        &copy; 2026 Furnitria. All rights reserved.
    </footer>
    <!-- HTML Structure -->
    <main class="hero">
    <div class="ctaContainer">
        <h1><span class="logo">Furnitria</span></h1>
        <p>Your domain for high-quality home appliances.</p>
        <div class="ctaButtons">
        <button class="ctaButton" data-target="products">View Our Products</button>
        <button class="ctaButton" data-target="account">Sign Up!</button>
        </div>
    </div>
    <nav class="navbar">
    <button class="hamburger-btn" alt="MenuButton">
    <img src="hamburger.png" alt="Menu" id="hamburger-icon">
    </button>
    <!-- Menu (collapses on mobile) -->
        <ul class="nav-menu">
            <li><a class="nav-link" data-target="products">Products</a></li>
            <li><a class="nav-link" data-target="about">About</a></li>
            <li><a class="nav-link" data-target="contact">Contact</a></li>
            <li><a class="nav-link" data-target="account">Account</a></li>
            <li><a class="nav-link" data-target="cart">Cart</a></li>
        </ul>
    </nav>
    <!-- Overlays -->
    <div class="overlayBackground">
    <section id="overlay" class="overlay">
        <div class="overlay-content">
            <div class="logoAndClose">
                <h1 class="logoOverlay">Furnitria</h1>
                <button class="closeOverlays">
                    <img src="close.png">
            </button>
            </div>
            <div class="overlayBanner">
                <ul class="bannerNav">
                    <li class="bannerItems" data-target="products"><img src="products.png"><a>Products</a></li>
                    <li class="bannerItems" data-target="account"><img src="account.png"><a>Account</a></li>
                    <li class="bannerItems" data-target="about"><img src="about.png"><a>About Us</a></li>
                    <li class="bannerItems" data-target="contact"><img src="contact.png"><a>Contact Us</a></li>
                    <li class="bannerItems" data-target="cart"><img src="cart.png"><a>Cart</a></li>
                </ul>
            </div>
            <div class="content"></div>
        </div>
    </section>
    </div>
</main>
<script type="module" src="js/main.js"></script>
<script src="https://js.stripe.com/v3/"></script>
</body>
</html>
