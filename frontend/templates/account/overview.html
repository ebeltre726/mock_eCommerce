<head></head>
<body>
    <div class="panel-overview">
      <div class="overview-hero">
        <div class="avatar-wrapper">
          <div class="avatar-container">
          <img id="user-avatar" src="avatar.png" alt="Profile Picture" class="avatar-img">
          </div>
          <button class="avatar-edit-btn" title="Change photo">Change Image &#9998;</button>
        </div>
        <div class="overview-info">
          <h2 id="user-fullname">Loading...</h2>
          <p id="user-email" class="user-email"></p>
          <p id="user-since" class="user-since"></p>
        </div>
      </div>
      <div class="overview-stats">
        <div class="stat-card">
          <span class="stat-value" id="stat-orders">0</span>
          <span class="stat-label">Orders</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-wishlist">0</span>
          <span class="stat-label">Item(s) wishlisted</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-points">0</span>
          <span class="stat-label">Points</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-returns">0</span>
          <span class="stat-label">Returns</span>
        </div>
      </div>
    </div>
</body>
