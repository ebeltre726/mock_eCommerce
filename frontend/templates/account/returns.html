<div class="panel-returns">
  <div class="panel-header">
    <h2>Returns & Refunds</h2>
    <button class="btn-primary initiate-return-btn">Initiate Return</button>
  </div>
  <ul class="returns-list" id="returns-list">
    <!-- Populated by account.js -->
  </ul>
  <div class="return-form hidden" id="return-form">
    <h3>Initiate a Return</h3>
    <div class="form-group">
      <label>Select Order</label>
      <select id="return-order-select">
        <option value="">-- Select an order --</option>
      </select>
    </div>
    <div class="form-group">
      <label>Reason for Return</label>
      <select id="return-reason">
        <option value="">-- Select reason --</option>
        <option value="defective">Defective / Damaged</option>
        <option value="wrong-item">Wrong Item Received</option>
        <option value="not-as-described">Not as Described</option>
        <option value="changed-mind">Changed My Mind</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Additional Notes</label>
      <textarea id="return-notes" placeholder="Describe the issue..."></textarea>
    </div>
    <div class="form-actions">
      <button class="btn-primary" id="submit-return-btn">Submit Return</button>
      <button class="btn-ghost" id="cancel-return-btn">Cancel</button>
    </div>
  </div>
</div>
