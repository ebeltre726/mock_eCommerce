<head></head>
<body>  
  <div class="panel-header">
    <h2>Payment Methods</h2>
    <button class="btn-primary add-card-btn">+ Add Card</button>
  </div>
  <div class="panel-payment">
  <ul class="card-list" id="card-list">
    <!-- Populated by account.js -->
  </ul>
  <div class="add-card-form hidden" id="add-card-form">
    <h3>Add New Card</h3>
    <div class="form-group">
      <label>Cardholder Name</label>
      <input type="text" id="card-name" placeholder="Jane Doe">
    </div>
    <div class="form-group">
      <label>Card Number</label>
      <input type="text" id="card-number" placeholder="**** **** **** ****" maxlength="19">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Expiry</label>
        <input type="text" id="card-expiry" placeholder="MM/YY" maxlength="5">
      </div>
      <div class="form-group">
        <label>CVV</label>
        <input type="text" id="card-cvv" placeholder="***" maxlength="3">
      </div>
    </div>
    <div class="form-actions">
      <button class="btn-primary" id="save-card-btn">Save Card</button>
      <button class="btn-ghost" id="cancel-card-btn">Cancel</button>
    </div>
    </div>
</body>
