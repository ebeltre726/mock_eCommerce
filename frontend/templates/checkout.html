          <section class="checkoutWrapper" role="dialog" aria-modal="true" aria-labelledby="checkoutTitle">
            <!-- Status overlay -->
            <div class="statusOverlay" id="statusOverlay" role="status" aria-live="polite">
              <div class="statusIcon" id="statusIcon"></div>
              <div class="statusTitle" id="statusTitle"></div>
              <div class="statusMessage" id="statusMessage"></div>
              <button class="statusDismiss" id="statusDismiss">Close</button>
            </div>
            <div class="checkoutContainer">
              <!-- Header -->
              <div class="checkoutHeader">
                <h2 class="checkoutTitle" id="checkoutTitle">Payment</h2>
                <button type="button" class="backButton" data-target="cart">← Back</button>
              </div>
              <!-- Scrollable body -->
              <div class="checkoutBody">
                <form class="checkoutContent" id="checkoutForm" novalidate>
                  <!-- Shipping -->
                  <div class="fieldGroup">
                    <label for="fullName">Full Name</label>
                    <input id="fullName" name="fullName" type="text" placeholder="Jane Smith"
                          autocomplete="name" required>
                  </div>
                  <div class="fieldGroup">
                    <label for="streetAddress">Street Address</label>
                    <input id="streetAddress" name="streetAddress" type="text"
                          placeholder="123 Main St" autocomplete="street-address" required>
                  </div>
                  <div class="fieldGroup">
                      <label for="city">City</label>
                      <input id="city" name="city" type="text"
                          placeholder="New York" autocomplete="address-level2" required>
                  </div>
                  <div class="fieldRow">
                  <div class="fieldGroup">
                      <label for="aptUnit">Apt / Unit (optional)</label>
                      <input id="aptUnit" name="aptUnit" type="text"
                          placeholder="Apt 4B" autocomplete="address-line2">
                  </div>
                  <div class="fieldGroup">
                      <label for="state">State</label>
                      <input id="state" name="state" type="text"
                          placeholder="NY" maxlength="2" autocomplete="address-level1" required>
                  </div>
                  </div>
                  <div class="fieldGroup">
                      <label for="postal">Zip / Postal Code</label>
                      <input id="postal" name="postal" type="text"
                          placeholder="10001" maxlength="5" autocomplete="postal-code" required>
                  </div>
                  <div class="divider"></div>
                  <!-- Card details -->
                  <div class="sectionLabel">Card Details</div>
                  <div class="fieldGroup">
                    <label>Card Number</label>
                    <p class="demoNotice">
                      ⚠️  This is a demo store. No real charges will be made.
                      <br>
                      Use card <strong>4242 4242 4242 4242</strong> to test.
                    </p>
                    <div class="stripeWrapper">
                        <div id="card-number" class="stripeElement"></div>
                    </div>
                </div>
                <div class="fieldRow">
                    <div class="fieldGroup">
                        <label>Expiry</label>
                        <div class="stripeWrapper">
                            <div id="card-expiry" class="stripeElement"></div>
                        </div>
                    </div>
                    <div class="fieldGroup">
                        <label>CVV</label>
                        <div class="stripeWrapper">
                            <div id="card-cvc" class="stripeElement"></div>
                        </div>
                    </div>
                </div>
                  <div class="divider"></div>
                  <!-- Cart preview (collapsed by default) -->
                  <div class="cartPreview" id="cartPreview" aria-expanded="false">
                    <div class="cartPreviewInner">
                      <div class="cartPreviewContent">
                        <div class="cartPreviewHeader">Your Cart</div>
                        <div class="cartGrid" id="cartGrid">
                          <div class="emptyCart">No items in cart.</div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <!-- Actions -->
                  <div class="paymentNav">
                    <button type="button" class="viewCartBtn" id="viewCartBtn">
                      <span id="viewCartLabel">View Cart</span>
                      <span class="chevron" id="cartChevron">▼</span>
                    </button>
                    <button type="submit" class="submitOrder" id="submitOrder">Place Order</button>
                  </div>
                </form>
              </div>
              <!-- Sticky total -->
              <div class="totalBar">
                <span class="totalLabel">Total</span>
                <span class="totalAmount" id="totalAmount">$0.00</span>
              </div>
            </div>
          </section>
