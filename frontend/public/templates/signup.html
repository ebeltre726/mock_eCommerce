<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furnitria | Login</title>
</head>
<body>
    <div class="signup-wrapper">
          <div class="signup-modal">
            <h2>Sign Up</h2>

            <form id="signup-form" >

              <div class="form-grid">
                <input type="text" name="firstName" placeholder="First Name" required />
                <input type="text" name="lastName" placeholder="Last Name" required />
            
                <input type="email" name="email" placeholder="Email Address" required />
                <input type="email" name="confirmEmail" placeholder="Confirm Email Address" required />
            
                <input type="password" name="password" placeholder="Password" required />
                <input type="password" name="confirmPassword" placeholder="Confirm Password" required />
                <p id="signup-error" class="error-msg"></p>
              </div>
            
              <div class="terms">
                <input type="checkbox" id="terms" required />
                <label for="terms">I agree to the Terms & Conditions</label>
              </div>
            
              <button type="submit" class="signup-btn" id="createAcc">
                Create Account
              </button>
            
              <p class="login-link">
                Already have an account? <button id="login-btn">Sign In</button>
              </p>
            
            </form>
          </div>
          </div>
</body>
</html>
