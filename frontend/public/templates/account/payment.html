<head></head>
<body>
  <div class="panel-header">
    <h2>Payment Methods</h2>
    <button class="btn-primary add-card-btn">+ Add Card</button>
  </div>
  <div class="panel-payment">
    <details class="demo-strip">
      <summary class="demo-strip-toggle">
        <span class="demo-strip-icon">⚠</span>
        <span class="demo-strip-label">Test mode &mdash; click to see valid card numbers</span>
      </summary>
      <div class="demo-strip-body">
        <table class="demo-strip-table">
          <tr><td>4242 4242 4242 4242</td><td>Success</td></tr>
          <tr><td>4000 0000 0000 0002</td><td>Card declined</td></tr>
          <tr><td>4000 0000 0000 9995</td><td>Insufficient funds</td></tr>
          <tr><td>4000 0000 0000 0069</td><td>Card expired</td></tr>
          <tr><td>4000 0000 0000 0127</td><td>Incorrect CVC</td></tr>
        </table>
        <span class="demo-strip-hint">Any future expiry &middot; any 3-digit CVV</span>
      </div>
    </details>

    <ul class="card-list" id="card-list">
      <!-- Populated by account.js -->
    </ul>

    <div class="add-card-form hidden" id="add-card-form">
      <h3>Add New Card</h3>

      <div class="form-group">
        <label>Cardholder Name</label>
        <input type="text" id="card-name" placeholder="Jane Doe">
      </div>

      <div class="form-group">
        <label>Card Number</label>
        <div id="account-card-number" class="stripe-element-container"></div>
      </div>

      <div id="account-card-errors" class="card-error-message"></div>

      <div class="form-row">
        <div class="form-group">
          <label>Expiry</label>
          <div id="account-card-expiry" class="stripe-element-container"></div>
        </div>
        <div class="form-group">
          <label>CVV</label>
          <div id="account-card-cvc" class="stripe-element-container"></div>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn-primary" id="save-card-btn">Save Card</button>
        <button class="btn-ghost" id="cancel-card-btn">Cancel</button>
      </div>
    </div>
  </div>
</body>
