<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furnitria | Login</title>
</head>
<body>
    <div class="signin-wrapper">

        <!-- Step 1: credentials -->
        <div class="signin-modal" id="login-step1">
            <h2>Sign In</h2>

            <form id="login-form">
              <label for="email">Email</label>
              <input class="signinInputs"
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
              />

              <label for="password">Password</label>
              <input class="signinInputs"
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
              />

              <div class="signin-options">
                <label>Remember Me</label>
                <input type="checkbox" />
              </div>

              <p id="signin-error" class="form-error" aria-live="polite"></p>

              <button type="submit" class="signin-btn" id="loginAcc">
                Sign In
              </button>
            </form>
        </div>

        <!-- Step 2: email verification (hidden until UserNotConfirmedException) -->
        <div class="verify-panel hidden" id="login-verify-step">
            <h2 class="verify-heading">Verify Email</h2>
            <p class="signin-sub" id="login-verify-sub">
                Code sent to your email.
            </p>

            <div class="otp-group" role="group" aria-label="Verification code">
                <input class="otp-input" type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1" />
                <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" />
                <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3" />
                <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4" />
                <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5" />
                <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6" />
            </div>

            <p class="form-error" id="login-verify-error" aria-live="polite"></p>

            <button class="signin-btn" id="login-verify-btn">Verify</button>

            <button class="verify-resend-btn" id="login-resend-btn" type="button">Resend code</button>

            <button class="verify-back-link" id="login-verify-back" type="button">&#8592; Back to Sign In</button>
        </div>

        <div id="dividingLine"></div>
        <div class="extras">
            <div class="extrasSubchild">
                <a>Forgot your password?</a>
                <button class="extraButton" id="reset-password-btn">Reset Password</button>
            </div>
            <div class="extrasSubchild">
                <a>Don't have an account?</a>
                <button class="extraButton" id="signup-button">Sign Up</button>
            </div>
        </div>
    </div>
</body>
</html>
