name: Deploy to AWS

on:
  push:
    branches: [main]

# OIDC token required for aws-actions/configure-aws-credentials role assumption
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO:   mock-ecommerce-backend
  TF_DIR:     infrastructure/terraform

jobs:
  # ──────────────────────────────────────────────────
  # 0. Ensure the ECR repository exists before we try to push to it.
  #    On first deploy the repo doesn't exist yet — Terraform normally creates
  #    it, but the build job runs before Terraform.  We use the AWS CLI directly
  #    rather than a targeted terraform apply -auto-approve to avoid plan-less
  #    applies and the risk of partial state mutations.
  #    The create-repository call is a no-op when the repo already exists.
  # ──────────────────────────────────────────────────
  bootstrap-ecr:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_ECR }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPO }} 2>/dev/null \
            || aws ecr create-repository \
                 --repository-name ${{ env.ECR_REPO }} \
                 --image-tag-mutability IMMUTABLE \
                 --image-scanning-configuration scanOnPush=true

      - name: Ensure ECR lifecycle policy is set
        run: |
          aws ecr put-lifecycle-policy \
            --repository-name ${{ env.ECR_REPO }} \
            --lifecycle-policy-text '{"rules":[{"rulePriority":1,"description":"Retain last 10 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  # ──────────────────────────────────────────────────
  # 1. Build and push backend container image to ECR
  # ──────────────────────────────────────────────────
  build-backend:
    runs-on: ubuntu-latest
    needs: bootstrap-ecr

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_BUILD }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag (short SHA)
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build and push
        env:
          REGISTRY:  ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          EXISTING=$(aws ecr batch-get-image \
            --repository-name $ECR_REPO \
            --image-ids imageTag=$IMAGE_TAG \
            --query 'images[0].imageId.imageTag' \
            --output text 2>/dev/null)
          if [ "$EXISTING" = "$IMAGE_TAG" ]; then
            echo "Image $ECR_REPO:$IMAGE_TAG already exists in ECR, skipping build"
          else
            docker build -t $REGISTRY/$ECR_REPO:$IMAGE_TAG ./backend
            docker push    $REGISTRY/$ECR_REPO:$IMAGE_TAG
          fi

  # ──────────────────────────────────────────────────
  # 2a. Terraform plan — output saved as artifact for review
  # ──────────────────────────────────────────────────
  terraform-plan:
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TF_PLAN }}
          aws-region:     ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -out=tfplan \
            -var="image_tag=${{ needs.build-backend.outputs.image_tag }}"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 1

  # ──────────────────────────────────────────────────
  # 2b. Terraform apply — gated by 'production' environment approval
  #     Configure required reviewers in: Settings → Environments → production
  # ──────────────────────────────────────────────────
  terraform-apply:
    runs-on: ubuntu-latest
    needs: [build-backend, terraform-plan]
    environment: production

    outputs:
      cloudfront_url:       ${{ steps.tf-output.outputs.cloudfront_url }}
      cognito_user_pool_id: ${{ steps.tf-output.outputs.cognito_user_pool_id }}
      cognito_client_id:    ${{ steps.tf-output.outputs.cognito_client_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:        ${{ secrets.AWS_ROLE_ARN_TF_APPLY }}
          aws-region:            ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Pre-flight DNS delegation check
        run: |
          DOMAIN="furnitria.com"
          NS=$(dig +short NS "$DOMAIN" @8.8.8.8 2>/dev/null | head -1)
          if [ -n "$NS" ] && ! echo "$NS" | grep -qi "awsdns"; then
            echo "::error::$DOMAIN is not delegated to Route 53 (current NS: $NS)."
            echo "::error::ACM certificate validation will time out. Update your domain registrar to use the Route 53 nameservers shown in 'terraform output name_servers', then re-run this workflow."
            exit 1
          fi
          echo "DNS delegation OK ($NS)"

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan -out=tfplan \
            -var="image_tag=${{ needs.build-backend.outputs.image_tag }}"
          terraform apply tfplan

      - name: Write secrets to SSM
        run: |
          aws ssm put-parameter \
            --name "/mock-ecommerce/prod/EMAILJS_PRIVATE_KEY" \
            --value "${{ secrets.EMAILJS_PRIVATE_KEY }}" \
            --type SecureString \
            --overwrite
          aws ssm put-parameter \
            --name "/mock-ecommerce/prod/STRIPE_SECRET_KEY" \
            --value "${{ secrets.STRIPE_SECRET_KEY }}" \
            --type SecureString \
            --overwrite

      - name: Capture Terraform outputs
        id: tf-output
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "cloudfront_url=$(terraform output -raw cloudfront_url)"             >> $GITHUB_OUTPUT
          echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)" >> $GITHUB_OUTPUT
          echo "cognito_client_id=$(terraform output -raw cognito_client_id)"       >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────────
  # 3. Seed products into DynamoDB (idempotent — no-op if already seeded)
  # ──────────────────────────────────────────────────
  seed-products:
    runs-on: ubuntu-latest
    needs: terraform-apply

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_SEED }}
          aws-region:     ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: ./backend
        run: npm ci

      - name: Seed products
        working-directory: ./backend
        run: node scripts/seed-products.js
        env:
          AWS_REGION:          ${{ env.AWS_REGION }}
          DYNAMODB_TABLE:      Furnitria
          S3_BUCKET_AVATARS:   ${{ secrets.S3_BUCKET_AVATARS }}
          S3_BUCKET_PRODUCTS:  ${{ secrets.S3_BUCKET_PRODUCTS }}
          STRIPE_SECRET_KEY:   placeholder   # not used by seed, satisfies env.js validation
          COGNITO_USER_POOL_ID: placeholder  # not used by seed, satisfies env.js validation
          COGNITO_CLIENT_ID:   placeholder   # not used by seed, satisfies env.js validation
          ALLOWED_ORIGINS:     placeholder   # not used by seed, satisfies env.js validation

  # ──────────────────────────────────────────────────
  # 4. Build frontend and deploy to S3 + invalidate CDN
  # ──────────────────────────────────────────────────
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [terraform-apply, seed-products]

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_FRONTEND }}
          aws-region:     ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_URL:              ${{ needs.terraform-apply.outputs.cloudfront_url }}/api
          # Cognito identifiers are not secrets — safe to embed in the frontend bundle
          VITE_COGNITO_USER_POOL_ID: ${{ needs.terraform-apply.outputs.cognito_user_pool_id }}
          VITE_COGNITO_CLIENT_ID:    ${{ needs.terraform-apply.outputs.cognito_client_id }}
          # Stripe publishable key is intentionally public — embedded in the frontend bundle
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Sync dist to S3
        run: |
          # Pass 1: all non-HTML assets — content-addressed filenames; cache forever
          aws s3 sync frontend/dist s3://${{ secrets.FRONTEND_BUCKET }} \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"
          # Pass 2: HTML only — must revalidate so users always get the latest SPA shell.
          # --exclude "*" + --include "*.html" scopes this pass to HTML files only;
          # without --exclude "*" the --include is a no-op and all files get no-cache.
          # No --delete here — the first pass already handled removals.
          aws s3 sync frontend/dist s3://${{ secrets.FRONTEND_BUCKET }} \
            --cache-control "no-cache" \
            --exclude "*" \
            --include "*.html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
