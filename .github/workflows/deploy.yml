name: Deploy to AWS

on:
  push:
    branches: [main]

env:
  AWS_REGION:   us-east-1
  ECR_REPO:     mock-ecommerce-backend
  TF_DIR:       infrastructure/terraform

jobs:
  # ──────────────────────────────────────────────────
  # 1. Build and push backend container image to ECR
  # ──────────────────────────────────────────────────
  build-backend:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag (short SHA)
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build and push
        env:
          REGISTRY:  ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build -t $REGISTRY/$ECR_REPO:$IMAGE_TAG ./backend
          docker push    $REGISTRY/$ECR_REPO:$IMAGE_TAG
          # Also tag latest for convenience
          docker tag  $REGISTRY/$ECR_REPO:$IMAGE_TAG $REGISTRY/$ECR_REPO:latest
          docker push $REGISTRY/$ECR_REPO:latest

  # ──────────────────────────────────────────────────
  # 2. Apply Terraform (updates Lambda to new image)
  # ──────────────────────────────────────────────────
  terraform:
    runs-on: ubuntu-latest
    needs: build-backend

    outputs:
      cloudfront_url: ${{ steps.tf-output.outputs.cloudfront_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init
        env:
          TF_VAR_image_tag: ${{ needs.build-backend.outputs.image_tag }}

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -var="image_tag=${{ needs.build-backend.outputs.image_tag }}"
        env:
          TF_VAR_image_tag: ${{ needs.build-backend.outputs.image_tag }}

      - name: Capture CloudFront URL
        id: tf-output
        working-directory: ${{ env.TF_DIR }}
        run: echo "cloudfront_url=$(terraform output -raw cloudfront_url)" >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────────
  # 3. Build frontend and deploy to S3 + invalidate CDN
  # ──────────────────────────────────────────────────
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ needs.terraform.outputs.cloudfront_url }}/api
        run: npm run build

      - name: Sync dist to S3
        run: |
          aws s3 sync frontend/dist s3://${{ secrets.FRONTEND_BUCKET }} \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"
          # HTML files must not be cached so users always get the latest SPA shell
          aws s3 sync frontend/dist s3://${{ secrets.FRONTEND_BUCKET }} \
            --delete \
            --cache-control "no-cache" \
            --include "*.html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
