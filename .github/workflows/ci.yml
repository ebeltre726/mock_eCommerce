name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Lint
        working-directory: ./backend
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Start services
        working-directory: ./backend
        run: docker compose up -d dynamodb-local minio minio-init
        env:
          AWS_ACCESS_KEY_ID:     minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_REGION:            us-east-1

      - name: Wait for DynamoDB
        run: |
          echo "Waiting for DynamoDB..."
          timeout 30 bash -c '
            until nc -z localhost 8000 2>/dev/null; do
              sleep 1
            done
          '
          echo "DynamoDB ready"

      - name: Wait for MinIO
        run: |
          echo "Waiting for MinIO..."
          timeout 30 bash -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'
          echo "MinIO ready"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run tests with coverage
        working-directory: ./backend
        run: npm run test:pr
        env:
          NODE_ENV:              test
          AWS_REGION:            us-east-1
          DYNAMODB_ENDPOINT:     http://localhost:8000
          S3_ENDPOINT:           http://localhost:9000
          S3_BUCKET_AVATARS:     avatars
          S3_BUCKET_PRODUCTS:    products
          AWS_ACCESS_KEY_ID:     minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          STRIPE_SECRET_KEY:     sk_test_dummy
          # Cognito is mocked in tests — these values are never validated against a real pool
          COGNITO_USER_POOL_ID:  us-east-1_testpool
          COGNITO_CLIENT_ID:     test-client-id
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Tear down services
        if: always()
        working-directory: ./backend
        run: docker compose down -v
        env:
          AWS_ACCESS_KEY_ID:     minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin1