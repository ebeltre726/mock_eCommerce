name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000

    env:
      NODE_ENV: test
      JWT_SECRET: test-secret-mockeCommerce
      DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_REGION: us-east-1

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Wait for DynamoDB Local
        run: sleep 5

      - name: Run tests
        working-directory: ./backend
        run: npm test

      - name: Run coverage
        working-directory: ./backend
        run: npm run test -- --coverage